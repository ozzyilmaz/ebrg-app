name: ios
# iOS derlemesi `eas build --local` ile (EAS bulut kotasi yemez). Sertifika/profil depo sirlarindan yazilir.
on: workflow_dispatch
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: En yeni Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Kimlik bilgileri
        env:
          P12_B64: ${{ secrets.P12_B64 }}
          P12_PAROLA: ${{ secrets.P12_PAROLA }}
          PROFIL_B64: ${{ secrets.PROFIL_B64 }}
        run: |
          mkdir -p .gizli
          echo "$P12_B64" | base64 --decode > .gizli/dist.p12
          echo "$PROFIL_B64" | base64 --decode > .gizli/ebrg_appstore.mobileprovision
          node -e "require('fs').writeFileSync('credentials.json', JSON.stringify({ios:{provisioningProfilePath:'.gizli/ebrg_appstore.mobileprovision',distributionCertificate:{path:'.gizli/dist.p12',password:process.env.P12_PAROLA}}}))"
      - name: Derle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx -y eas-cli@latest build -p ios --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/ebrg.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ebrg-ios
          path: ebrg.ipa
          retention-days: 3
